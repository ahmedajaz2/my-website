<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ocean Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#020e1c;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Arial Black',Arial,sans-serif;overflow:hidden;touch-action:none;}
#wrap{position:relative;width:390px;}
#hud{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#05192e;border-radius:16px 16px 0 0;border:2px solid #1a4a6e;border-bottom:none;}
#pauseBtn{width:38px;height:38px;background:#0d2d4a;border:2px solid #1a4a6e;border-radius:10px;color:#7ecfff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hud-box{flex:1;background:#0d2d4a;border:2px solid #1a4a6e;border-radius:10px;text-align:center;padding:4px 5px;}
.hud-label{font-size:8px;color:#7ecfff;letter-spacing:1px;font-weight:700;}
.hud-num{font-size:18px;color:#fff;font-weight:900;line-height:1.1;}
#livesEl{font-size:11px;letter-spacing:1px;}
#stageBanner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:25;pointer-events:none;font-size:13px;font-weight:700;color:#7ef0ff;text-shadow:0 0 10px #0af;letter-spacing:2px;opacity:0;transition:opacity 0.3s;white-space:nowrap;}
#gameArea{position:relative;width:390px;height:580px;overflow:hidden;border:2px solid #1a4a6e;border-top:none;border-radius:0 0 16px 16px;}
canvas{position:absolute;top:0;left:0;width:390px;height:580px;}
.screen{position:absolute;inset:0;background:rgba(0,12,28,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;gap:10px;border-radius:0 0 16px 16px;}
.screen h2{font-size:24px;color:#fff;font-weight:900;text-shadow:0 0 20px #0af;}
.screen p{font-size:11px;color:#7ecfff;text-align:center;padding:0 20px;line-height:1.6;}
.btn{padding:10px 28px;border-radius:12px;border:none;font-size:15px;font-weight:900;cursor:pointer;}
.btn-start{background:linear-gradient(135deg,#00c8ff,#0060bb);color:#fff;}
.btn-restart{background:linear-gradient(135deg,#ff4fa3,#bb006e);color:#fff;}
/* Joystick inside game area */
#joystickBase{position:absolute;bottom:18px;left:18px;z-index:20;width:130px;height:130px;border-radius:50%;background:rgba(180,220,255,0.10);border:1.5px solid rgba(180,220,255,0.22);pointer-events:none;will-change:transform;}
#joystickThumb{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(200,235,255,0.28);border:1.5px solid rgba(200,235,255,0.45);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;transition:background 0.1s;will-change:transform;}
#joystickThumb.active{background:rgba(200,235,255,0.42);}
#joystickZone{position:absolute;bottom:0;left:0;z-index:19;width:220px;height:220px;}
#du{grid-column:2;grid-row:1;}#dl{grid-column:1;grid-row:2;}#dd{grid-column:2;grid-row:2;}#dr{grid-column:3;grid-row:2;}
/* FIRE BUTTON */
#fireBtn{position:absolute;bottom:14px;right:14px;z-index:20;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,106,0,0.80),rgba(180,30,0,0.72));border:2.5px solid rgba(255,144,64,0.65);color:#fff;font-size:11px;font-weight:900;cursor:pointer;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 0 12px rgba(255,100,0,0.4);-webkit-tap-highlight-color:transparent;letter-spacing:1px;}
#fireBtn:active{transform:scale(0.91);box-shadow:0 0 22px rgba(255,140,0,0.8);}
#fireBtn .fire-icon{font-size:18px;line-height:1;}
/* Floating score popups */
.popup{position:absolute;pointer-events:none;font-weight:900;font-size:16px;z-index:20;text-shadow:0 0 8px currentColor;animation:popFloat 0.9s ease-out forwards;}
@keyframes popFloat{0%{opacity:1;transform:translateY(0) scale(1);}60%{opacity:1;transform:translateY(-28px) scale(1.2);}100%{opacity:0;transform:translateY(-52px) scale(0.8);}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <button id="pauseBtn">⏸</button>
    <div class="hud-box"><div class="hud-label">SCORE</div><div class="hud-num" id="scoreEl">0</div></div>
    <div class="hud-box"><div class="hud-label">STAGE</div><div class="hud-num" id="stageEl">1</div></div>
    <div class="hud-box"><div class="hud-label">LIVES</div><div class="hud-num" id="livesEl" style="color:#ff4466;font-size:14px;letter-spacing:2px;">♥♥♥</div></div>
    <div class="hud-box"><div class="hud-label">HIGH</div><div class="hud-num" id="highEl">0</div></div>
  </div>
  <div id="gameArea">
    <canvas id="bgC" width="390" height="580"></canvas>
    <canvas id="fxC" width="390" height="580"></canvas>
    <canvas id="gc"  width="390" height="580"></canvas>
    <div id="stageBanner"></div>
    <button id="fireBtn"><span class="fire-icon">🔥</span>FIRE</button>
    <div id="startScreen" class="screen">
      <div style="font-size:44px">🐟</div>
      <h2>OCEAN RUSH</h2>
      <p>Move with d-pad • Press 🔥 to shoot!<br>Sharks = 5pts • Faster enemies = more pts<br>You have 3 lives — dodge or shoot!</p>
      <button class="btn btn-start" id="startBtn">Start Game</button>
    </div>
    <div id="overScreen" class="screen" style="display:none">
      <div style="font-size:44px">💀</div>
      <h2>GAME OVER</h2>
      <p>Stage <span id="finalStage" style="color:#0af;font-weight:900"></span> reached!<br>Final Score: <span id="finalScore" style="color:#fff;font-weight:900;font-size:18px"></span></p>
      <button class="btn btn-restart" id="restartBtn">Play Again</button>
    </div>
    <div id="pauseScreen" class="screen" style="display:none">
      <h2>PAUSED</h2>
      <button class="btn btn-start" id="resumeBtn">Resume</button>
    </div>
    <div id="joystickZone"></div>
    <div id="joystickBase"><div id="joystickThumb"></div></div>
  </div>
</div>

<script>
const bgC=document.getElementById('bgC'),bgX=bgC.getContext('2d');
const fxC=document.getElementById('fxC'),fxX=fxC.getContext('2d');
const gc=document.getElementById('gc'),ctx=gc.getContext('2d');
const W=390,H=580;
const stageBanner=document.getElementById('stageBanner');
const gameAreaEl=document.getElementById('gameArea');

// ── Points per creature type (base, faster ones get bonus) ──
const BASE_PTS={shark:5,jelly:6,octo:7,star:4,puffer:6,eel:8};

// ══════════════════════════════════════════════
//  STATIC BACKGROUND
// ══════════════════════════════════════════════
function drawStaticBg(){
  const g=bgX.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0e5aa8');g.addColorStop(0.25,'#0a3f80');g.addColorStop(0.6,'#072a58');g.addColorStop(1,'#041828');
  bgX.fillStyle=g;bgX.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){
    const x=20+i*44,rg=bgX.createLinearGradient(x,0,x+25,H*0.82);
    rg.addColorStop(0,'rgba(140,220,255,0.18)');rg.addColorStop(1,'rgba(140,220,255,0)');
    bgX.beginPath();bgX.moveTo(x,0);bgX.lineTo(x+30,0);bgX.lineTo(x+82,H*0.82);bgX.lineTo(x+46,H*0.82);bgX.closePath();bgX.fillStyle=rg;bgX.fill();
  }
  bgX.fillStyle='rgba(120,210,255,0.1)';
  for(let i=0;i<W;i+=16){bgX.beginPath();bgX.ellipse(i,3,10,4,0,0,Math.PI*2);bgX.fill();}
  bgX.fillStyle='rgba(120,180,240,0.18)';
  for(let i=0;i<20;i++){bgX.beginPath();bgX.ellipse(40+i*16,H*0.38+Math.sin(i*0.7)*12,5,3,0,0,Math.PI*2);bgX.fill();}
  bgX.fillStyle='rgba(100,155,220,0.12)';
  for(let i=0;i<14;i++){bgX.beginPath();bgX.ellipse(20+i*24,H*0.62+Math.sin(i*0.9)*9,4,2.5,0.3,0,Math.PI*2);bgX.fill();}
  bgX.strokeStyle='rgba(15,45,85,0.45)';
  function silCoral(x,y,len,ang,d){if(d===0||len<4)return;const ex=x+Math.cos(ang)*len,ey=y-Math.sin(ang)*len;bgX.beginPath();bgX.moveTo(x,y);bgX.lineTo(ex,ey);bgX.stroke();silCoral(ex,ey,len*0.65,ang+0.45,d-1);silCoral(ex,ey,len*0.65,ang-0.45,d-1);}
  for(let i=0;i<7;i++){bgX.lineWidth=1.5+Math.sin(i)*0.8;silCoral(30+i*56,H,20+Math.sin(i)*10,Math.PI/2,3);}
  const sb=bgX.createLinearGradient(0,H-110,0,H);
  sb.addColorStop(0,'rgba(3,18,38,0)');sb.addColorStop(0.5,'rgba(3,14,32,0.92)');sb.addColorStop(1,'rgba(2,8,20,1)');
  bgX.fillStyle=sb;bgX.fillRect(0,H-110,W,110);
  bgX.fillStyle='#08203a';bgX.beginPath();bgX.moveTo(0,H);
  for(let x=0;x<=W;x+=8)bgX.lineTo(x,H-48+Math.sin(x*0.038)*12+Math.cos(x*0.09)*5);
  bgX.lineTo(W,H);bgX.closePath();bgX.fill();
  bgX.strokeStyle='rgba(20,65,110,0.22)';bgX.lineWidth=1;
  for(let x=0;x<W;x+=30){bgX.beginPath();bgX.moveTo(x,H-50);bgX.lineTo(x,H);bgX.stroke();}
  for(let y=H-46;y<H;y+=16){bgX.beginPath();bgX.moveTo(0,y);bgX.lineTo(W,y);bgX.stroke();}
  function sw(x,y,h,col,lw){bgX.save();bgX.strokeStyle=col;bgX.lineWidth=lw;bgX.lineCap='round';bgX.beginPath();bgX.moveTo(x,y);for(let i=1;i<=5;i++){const cy=y-h*i/5,cx=x+(i%2===0?12:-12);bgX.quadraticCurveTo(cx,cy-h/10,x,cy);}bgX.stroke();bgX.restore();}
  sw(26,H-12,75,'#1a7a3a',5);sw(48,H-12,58,'#0f5c2a',4);sw(10,H-12,48,'#23963f',3.5);
  sw(W-28,H-12,70,'#1a7a3a',5);sw(W-52,H-12,55,'#0f5c2a',4);sw(W-12,H-12,45,'#23963f',3.5);
  sw(200,H-12,50,'#1d8040',4);sw(240,H-12,40,'#166832',3.5);
  function coral(x,y,col,sz){bgX.save();function br(bx,by,len,ang,d){if(d===0||len<4)return;const ex=bx+Math.cos(ang)*len,ey=by-Math.sin(ang)*len;bgX.beginPath();bgX.moveTo(bx,by);bgX.lineTo(ex,ey);bgX.lineWidth=d*1.5;bgX.strokeStyle=col;bgX.stroke();br(ex,ey,len*0.65,ang+0.5,d-1);br(ex,ey,len*0.65,ang-0.5,d-1);if(d===1){bgX.beginPath();bgX.arc(ex,ey,3,0,Math.PI*2);bgX.fillStyle=col;bgX.fill();}}br(x,y,sz,Math.PI/2,4);bgX.restore();}
  coral(80,H-12,'#c0462a',28);coral(106,H-12,'#e05a1e',20);coral(W-76,H-12,'#d44020',26);coral(W-102,H-12,'#b03c28',18);
  function rock(x,y,w,h){bgX.save();bgX.fillStyle='#1a3a5c';bgX.strokeStyle='#0d2440';bgX.lineWidth=1.5;bgX.beginPath();bgX.moveTo(x-w/2,y);bgX.quadraticCurveTo(x-w/2-5,y-h,x,y-h);bgX.quadraticCurveTo(x+w/2+5,y-h,x+w/2,y);bgX.closePath();bgX.fill();bgX.stroke();bgX.restore();}
  rock(W-52,H-12,44,20);rock(W-88,H-12,28,14);rock(138,H-12,36,16);rock(260,H-12,24,12);
  function tube(x,y,col,r,h){bgX.save();bgX.fillStyle=col;bgX.strokeStyle='rgba(0,0,0,0.3)';bgX.lineWidth=1;bgX.beginPath();bgX.moveTo(x-r,y);bgX.lineTo(x-r,y-h);bgX.quadraticCurveTo(x,y-h-r*0.8,x+r,y-h);bgX.lineTo(x+r,y);bgX.closePath();bgX.fill();bgX.stroke();bgX.beginPath();bgX.ellipse(x,y-h,r,r*0.4,0,0,Math.PI*2);bgX.fillStyle='rgba(0,0,0,0.35)';bgX.fill();bgX.restore();}
  tube(W-26,H-12,'#e6c010',8,26);tube(W-16,H-12,'#c8a800',5,18);tube(165,H-12,'#8b3fbe',7,18);tube(177,H-12,'#6b2f9e',5,13);
  bgX.fillStyle='#5c2a7e';for(let i=0;i<5;i++){bgX.beginPath();bgX.arc(310+i*8,H-18,3.5+Math.sin(i)*1.2,0,Math.PI*2);bgX.fill();}
  bgX.fillStyle='#e05080';for(let i=0;i<8;i++){const a=i*Math.PI/4;bgX.beginPath();bgX.ellipse(340+Math.cos(a)*8,H-20+Math.sin(a)*5,4,6,a,0,Math.PI*2);bgX.fill();}
  bgX.fillStyle='#ff80a0';bgX.beginPath();bgX.arc(340,H-20,4,0,Math.PI*2);bgX.fill();
}

// ══════════════════════════════════════════════
//  BUBBLES
// ══════════════════════════════════════════════
const bubbles=[];
for(let i=0;i<26;i++)bubbles.push({x:Math.random()*W,y:Math.random()*H,r:1.2+Math.random()*4,spd:0.22+Math.random()*0.5,o:0.06+Math.random()*0.18,drift:(Math.random()-0.5)*0.28});
function drawFx(){
  fxX.clearRect(0,0,W,H);
  bubbles.forEach(b=>{
    b.y-=b.spd;b.x+=b.drift;
    if(b.y<-10){b.y=H+10;b.x=Math.random()*W;}
    if(b.x<2||b.x>W-2)b.drift*=-1;
    fxX.save();fxX.strokeStyle=`rgba(180,235,255,${b.o})`;fxX.lineWidth=1;
    fxX.beginPath();fxX.arc(b.x,b.y,b.r,0,Math.PI*2);fxX.stroke();
    fxX.fillStyle=`rgba(220,248,255,${b.o*0.5})`;
    fxX.beginPath();fxX.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.26,0,Math.PI*2);fxX.fill();
    fxX.restore();
  });
}

// ══════════════════════════════════════════════
//  DRAW: FISH (player, faces up)
// ══════════════════════════════════════════════
function drawFish(c,cx,cy,r){
  c.save();c.translate(cx,cy);
  c.fillStyle='#0050cc';c.beginPath();c.moveTo(0,r*0.95);c.lineTo(-r*0.58,r*1.6);c.lineTo(r*0.58,r*1.6);c.closePath();c.fill();
  const bg=c.createRadialGradient(-r*0.1,-r*0.2,r*0.05,0,0,r);
  bg.addColorStop(0,'#90eeff');bg.addColorStop(0.35,'#1a8cff');bg.addColorStop(1,'#0044cc');
  c.fillStyle=bg;c.beginPath();c.ellipse(0,0,r*0.52,r*0.88,0,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(255,255,255,0.45)';c.lineWidth=2;c.beginPath();c.ellipse(0,0,r*0.52,r*0.88,0,0,Math.PI*2);c.stroke();
  c.fillStyle='rgba(255,255,255,0.2)';c.beginPath();c.ellipse(r*0.08,r*0.1,r*0.26,r*0.5,0,0,Math.PI*2);c.fill();
  c.fillStyle='#1a7aee';
  c.beginPath();c.moveTo(r*0.44,r*0.12);c.quadraticCurveTo(r*0.9,r*0.42,r*0.5,r*0.65);c.quadraticCurveTo(r*0.5,r*0.32,r*0.44,r*0.12);c.fill();
  c.beginPath();c.moveTo(-r*0.44,r*0.12);c.quadraticCurveTo(-r*0.9,r*0.42,-r*0.5,r*0.65);c.quadraticCurveTo(-r*0.5,r*0.32,-r*0.44,r*0.12);c.fill();
  c.fillStyle='#1a8cff';c.beginPath();c.moveTo(-r*0.2,-r*0.72);c.lineTo(0,-r*1.22);c.lineTo(r*0.2,-r*0.72);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,0.16)';c.lineWidth=1;
  c.beginPath();c.arc(0,r*0.06,r*0.32,Math.PI*1.1,Math.PI*2.4);c.stroke();
  c.fillStyle='white';c.beginPath();c.arc(r*0.19,-r*0.44,r*0.17,0,Math.PI*2);c.fill();
  c.fillStyle='#0a0a2a';c.beginPath();c.arc(r*0.21,-r*0.49,r*0.09,0,Math.PI*2);c.fill();
  c.fillStyle='white';c.beginPath();c.arc(r*0.25,-r*0.53,r*0.045,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(255,255,255,0.6)';c.lineWidth=1.5;c.lineCap='round';
  c.beginPath();c.arc(-r*0.04,-r*0.24,r*0.11,0.2,Math.PI-0.2);c.stroke();
  c.restore();
}

// ── BULLET ──
function drawBullet(c,bx,by){
  c.save();c.translate(bx,by);
  // glowing orb
  const g=c.createRadialGradient(0,0,1,0,0,7);
  g.addColorStop(0,'rgba(255,255,180,1)');
  g.addColorStop(0.4,'rgba(255,200,50,0.9)');
  g.addColorStop(0.8,'rgba(255,120,0,0.6)');
  g.addColorStop(1,'rgba(255,80,0,0)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,8,0,Math.PI*2);c.fill();
  // core
  c.fillStyle='#fff8a0';c.beginPath();c.arc(0,0,3,0,Math.PI*2);c.fill();
  // tail trail
  c.strokeStyle='rgba(255,160,0,0.5)';c.lineWidth=3;c.lineCap='round';
  c.beginPath();c.moveTo(0,0);c.lineTo(0,12);c.stroke();
  c.restore();
}

// ── MINE ──
function drawMine(c,mx,my,r,frame){
  c.save();c.translate(mx,my);
  // Pulsing glow ring
  const pulse=0.6+0.4*Math.sin(frame*0.08);
  const glow=c.createRadialGradient(0,0,r*0.8,0,0,r*1.8);
  glow.addColorStop(0,`rgba(255,60,60,${0.18*pulse})`);
  glow.addColorStop(1,'rgba(255,0,0,0)');
  c.fillStyle=glow;c.beginPath();c.arc(0,0,r*1.8,0,Math.PI*2);c.fill();
  // Spikes
  c.strokeStyle='#cc2200';c.lineWidth=2.5;c.lineCap='round';
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+(frame*0.005);
    c.beginPath();c.moveTo(Math.cos(a)*r,Math.sin(a)*r);c.lineTo(Math.cos(a)*(r+7),Math.sin(a)*(r+7));c.stroke();
  }
  // Body
  const mg=c.createRadialGradient(-r*0.3,-r*0.3,r*0.05,0,0,r);
  mg.addColorStop(0,'#888898');mg.addColorStop(0.5,'#444455');mg.addColorStop(1,'#222230');
  c.fillStyle=mg;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  c.strokeStyle='#111120';c.lineWidth=1.5;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();
  // Blinking light
  const blink=Math.sin(frame*0.18)>0;
  c.fillStyle=blink?'#ff2200':'#550000';
  c.beginPath();c.arc(0,0,r*0.28,0,Math.PI*2);c.fill();
  c.fillStyle=blink?'rgba(255,80,0,0.7)':'rgba(80,0,0,0)';
  c.beginPath();c.arc(0,0,r*0.42,0,Math.PI*2);c.fill();
  // Sheen
  c.fillStyle='rgba(255,255,255,0.12)';c.beginPath();c.ellipse(-r*0.28,-r*0.32,r*0.3,r*0.16,0,0,Math.PI*2);c.fill();
  c.restore();
}


function drawExplosion(c,ex,ey,progress){
  // progress 0..1
  const r=28*progress;
  c.save();c.translate(ex,ey);
  for(let i=0;i<8;i++){
    const ang=i*Math.PI/4;
    const len=r*(0.7+Math.sin(i)*0.3);
    c.strokeStyle=`rgba(255,${Math.floor(180-100*progress)},0,${1-progress})`;
    c.lineWidth=3*(1-progress)+1;c.lineCap='round';
    c.beginPath();c.moveTo(Math.cos(ang)*r*0.2,Math.sin(ang)*r*0.2);c.lineTo(Math.cos(ang)*len,Math.sin(ang)*len);c.stroke();
  }
  const g=c.createRadialGradient(0,0,0,0,0,r*0.6);
  g.addColorStop(0,`rgba(255,255,200,${0.8*(1-progress)})`);
  g.addColorStop(1,'rgba(255,100,0,0)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r*0.6,0,Math.PI*2);c.fill();
  c.restore();
}

// ══════════════════════════════════════════════
//  ENEMY DRAWERS (same as v9)
// ══════════════════════════════════════════════
function drawShark(c,cx,cy,r){
  c.save();c.translate(cx,cy);
  c.fillStyle='#3a8abf';
  c.beginPath();c.moveTo(-r*0.12,-r*0.95);c.quadraticCurveTo(-r*0.48,-r*1.42,-r*0.68,-r*1.75);c.quadraticCurveTo(-r*0.38,-r*1.32,-r*0.08,-r*1.02);c.closePath();c.fill();

const MINE_BLAST_R=80; // chain-kill radius
const MINE_SPD=1.3;    // straight-line drift speed

function triggerMineBlast(mx,my){
  // Big explosion visual
  explosions.push({x:mx,y:my,life:0,type:'mine'});
  playMineBlastSound();
  // Kill all enemies within blast radius
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=e.x-mx,dy=e.y-my;
    if(Math.sqrt(dx*dx+dy*dy)<MINE_BLAST_R+e.r){
      const pts=calcPts(e);
      score+=pts;
      document.getElementById('scoreEl').textContent=score;
      spawnPopup(e.x,e.y,pts,'#ff8800');
      explosions.push({x:e.x,y:e.y,life:0,type:'enemy'});
      enemies.splice(i,1);
    }
  }
  // Chain: trigger other mines in range
  for(let i=mines.length-1;i>=0;i--){
    const m=mines[i];
    if(m.blasting)continue;
    const dx=m.x-mx,dy=m.y-my;
    if(Math.sqrt(dx*dx+dy*dy)<MINE_BLAST_R+MINE_R){
      m.blasting=true;
      setTimeout(()=>{
        const idx=mines.indexOf(m);
        if(idx!==-1){mines.splice(idx,1);triggerMineBlast(m.x,m.y);}
      },120);
    }
  }
}

function spawnMine(){
  if(!gameRunning||paused)return;
  // Mines start from any edge, drift in a straight line across screen
  // 0=top, 1=right side (upper half), 2=left side (upper half) — never from bottom
  const side=Math.floor(Math.random()*3);
  let x,y,vx,vy;
  if(side===0){x=MINE_R+Math.random()*(W-MINE_R*2);y=-MINE_R*2;vx=(Math.random()-0.5)*0.6;vy=MINE_SPD;}
  else if(side===1){x=W+MINE_R*2;y=MINE_R+Math.random()*(H/2-MINE_R*2);vx=-MINE_SPD;vy=(Math.random()-0.5)*0.6;}
  else{x=-MINE_R*2;y=MINE_R+Math.random()*(H/2-MINE_R*2);vx=MINE_SPD;vy=(Math.random()-0.5)*0.6;}
  mines.push({x,y,vx,vy,frame:0,blasting:false});
}

let invincible=false, invincibleFrames=0;
const INVINCIBLE_DURATION=90; // frames of blink after hit

function playHitSound(){
  try{
    const ctx=getAudioCtx();
    const t=ctx.currentTime;
    // Low thudding impact
    const impactOsc=ctx.createOscillator();
    const impactEnv=ctx.createGain();
    impactOsc.type='sine';
    impactOsc.frequency.setValueAtTime(180,t);
    impactOsc.frequency.exponentialRampToValueAtTime(55,t+0.18);
    impactEnv.gain.setValueAtTime(0.55,t);
    impactEnv.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    impactOsc.connect(impactEnv);impactEnv.connect(ctx.destination);
    impactOsc.start(t);impactOsc.stop(t+0.25);
    // Distorted crunch burst (noise)
    const bufLen=ctx.sampleRate*0.12;
    const noiseBuf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const nd=noiseBuf.getChannelData(0);
    for(let i=0;i<bufLen;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/bufLen,1.5);
    const noiseSrc=ctx.createBufferSource();noiseSrc.buffer=noiseBuf;
    const noiseFilter=ctx.createBiquadFilter();noiseFilter.type='bandpass';noiseFilter.frequency.value=400;noiseFilter.Q.value=0.5;
    const noiseEnv=ctx.createGain();noiseEnv.gain.setValueAtTime(0.3,t);noiseEnv.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    noiseSrc.connect(noiseFilter);noiseFilter.connect(noiseEnv);noiseEnv.connect(ctx.destination);
    noiseSrc.start(t);noiseSrc.stop(t+0.14);
    // Rising alert tone — "uh-oh"
    [440,330,220].forEach((freq,i)=>{
      const o=ctx.createOscillator();const e=ctx.createGain();
      o.type='triangle';o.frequency.value=freq;
      e.gain.setValueAtTime(0,t+0.08+i*0.1);
      e.gain.linearRampToValueAtTime(0.14,t+0.1+i*0.1);
      e.gain.exponentialRampToValueAtTime(0.0001,t+0.22+i*0.1);
      o.connect(e);e.connect(ctx.destination);
      o.start(t+0.08+i*0.1);o.stop(t+0.26+i*0.1);
    });
  }catch(e){}
}

function playMineBlastSound(){
  try{
    const c=getAudioCtx(),t=c.currentTime;
    // Deep thud
    const o=c.createOscillator(),e=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(28,t+0.4);
    e.gain.setValueAtTime(0.7,t);e.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.connect(e);e.connect(c.destination);o.start(t);o.stop(t+0.55);
    // Noise burst
    const bufLen=c.sampleRate*0.25,nb=c.createBuffer(1,bufLen,c.sampleRate);
    const nd=nb.getChannelData(0);for(let i=0;i<bufLen;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/bufLen,1.2);
    const ns=c.createBufferSource();ns.buffer=nb;
    const nf=c.createBiquadFilter();nf.type='bandpass';nf.frequency.value=300;nf.Q.value=0.4;
    const ne=c.createGain();ne.gain.setValueAtTime(0.4,t);ne.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
    ns.connect(nf);nf.connect(ne);ne.connect(c.destination);ns.start(t);ns.stop(t+0.28);
  }catch(e){}
}

function loseLife(){
  lives--;updateLivesUI();
  explosions.push({x:px,y:py,life:0,type:'player'});
  playHitSound();
  // Always blink — on last life, end game only after blink finishes
  invincible=true;
  invincibleFrames=INVINCIBLE_DURATION;
  if(lives<=0){
    setTimeout(()=>{if(gameRunning)endGame();}, INVINCIBLE_DURATION*16+200);
  }
}

function spawnEnemy(){
  if(!gameRunning||paused)return;
  const st=STAGES[stage];
  const type=pickType(st.weights);
  let r,extraH;
  if(type==='shark'){r=18+Math.random()*12;extraH=r*2.4;}
  else if(type==='jelly'){r=16+Math.random()*10;extraH=r*2.2;}
  else if(type==='octo'){r=16+Math.random()*10;extraH=r*1.5;}
  else if(type==='star'){r=14+Math.random()*10;extraH=r*1.2;}
  else if(type==='puffer'){r=15+Math.random()*8;extraH=r*1.4;}
  else{r=14+Math.random()*8;extraH=r*4.5;}
  const x=r*1.8+Math.random()*(W-r*3.6);
  const spd=STAGES[stage].baseSpd*(0.82+Math.random()*0.36);
  enemies.push({type,x,y:-extraH,r,spd,wobble:Math.random()*Math.PI*2,wobbleAmp:type==='star'?0:6+Math.random()*12,wobbleSpd:0.014+Math.random()*0.02,frame:0});
}

function tryFire(){
  const now=Date.now();
  if(now-lastFireTime<FIRE_COOLDOWN)return;
  lastFireTime=now;
  // fire from fish nose (top of fish)
  bullets.push({x:px,y:py-PR*1.2,vy:-BULLET_SPD});
}

// Score for hitting an enemy: base pts + speed bonus
function calcPts(enemy){
  const base=BASE_PTS[enemy.type]||5;
  const spdBonus=Math.floor((enemy.spd-2)*2); // faster = more bonus
  return Math.max(base, base+spdBonus);
}

function loop(){
  if(!gameRunning||paused)return;
  frame++;

  // Score from surviving (1 pt/frame reduced to prevent inflation — bullet kills are main source)
  // Score only increases on kills (see bullet hit section below)

  // Stage progression
  const newSt=getStageIdx(score);
  if(newSt>stage){
    stage=newSt;
    document.getElementById('stageEl').textContent=stage+1;
    showStageBanner(stage+1);
    clearInterval(spawnInt);clearInterval(mineSpawnInt);
    spawnInt=setInterval(spawnEnemy,STAGES[stage].interval);
    mineSpawnInt=setInterval(spawnMine,Math.max(2000,4500-stage*300));
  }

  // Player movement — joystick takes priority, arrow keys as fallback
  const moveX = joyDx || (keys.ArrowRight?1:0) - (keys.ArrowLeft?1:0);
  const moveY = joyDy || (keys.ArrowDown?1:0) - (keys.ArrowUp?1:0);
  if(moveX) px=Math.max(PR,Math.min(W-PR, px+moveX*PLAYER_MOVE));
  if(moveY) py=Math.max(PR,Math.min(H-PR, py+moveY*PLAYER_MOVE));
  if(fireHeld)tryFire();

  drawFx();
  ctx.clearRect(0,0,W,H);

  // ── Move & draw bullets ──
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.y+=b.vy;
    if(b.y<-15){bullets.splice(i,1);continue;}
    drawBullet(ctx,b.x,b.y);
  }

  // ── Move, draw & collide enemies ──
  for(let ei=enemies.length-1;ei>=0;ei--){
    const e=enemies[ei];
    e.y+=e.spd;e.wobble+=e.wobbleSpd;e.frame++;
    const ex=e.type==='eel'?e.x:e.x+Math.sin(e.wobble)*e.wobbleAmp;

    if(e.type==='shark')    drawShark(ctx,ex,e.y,e.r);
    else if(e.type==='jelly')drawJellyfish(ctx,ex,e.y,e.r,e.frame);
    else if(e.type==='octo') drawOctopus(ctx,ex,e.y,e.r,e.frame);
    else if(e.type==='star') drawStarfish(ctx,ex,e.y,e.r,e.frame);
    else if(e.type==='puffer')drawPuffer(ctx,ex,e.y,e.r,e.frame);
    else                     drawEel(ctx,e.x,e.y,e.r,e.frame);

    // Bullet hit?
    let hit=false;
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];
      const dx2=b.x-ex,dy2=b.y-e.y;
      if(Math.sqrt(dx2*dx2+dy2*dy2)<e.r*0.85){
        // hit!
        const pts=calcPts(e);
        score+=pts;
        document.getElementById('scoreEl').textContent=score;
        spawnPopup(ex,e.y,pts,
          e.type==='shark'?'#ff6060':
          e.type==='eel'?'#60ff80':
          e.type==='jelly'?'#e060ff':
          e.type==='octo'?'#ff60cc':
          e.type==='puffer'?'#c0ff40':'#ffcc40');
        explosions.push({x:ex,y:e.y,life:0,type:'enemy'});
        bullets.splice(bi,1);
        enemies.splice(ei,1);
        hit=true;
        break;
      }
    }
    if(hit)continue;

    // Player collision — skip if invincible
    if(lives>0 && !invincible){
      const dx=ex-px,dy=e.y-py;
      const hitR=e.type==='star'?e.r*0.85:e.type==='jelly'?e.r*0.65:e.r*0.72;
      if(Math.sqrt(dx*dx+dy*dy)<hitR+PR*0.8){
        enemies.splice(ei,1);
        loseLife();
        continue;
      }
    }

    const clearY=e.type==='eel'?H+e.r*5:H+e.r*2.5;
    if(e.y>clearY)enemies.splice(ei,1);
  }

  // ── Explosions ──
  for(let i=explosions.length-1;i>=0;i--){
    const ex2=explosions[i];
    ex2.life+=ex2.type==='mine'?0.04:0.07;
    const maxR=ex2.type==='mine'?MINE_BLAST_R:28;
    // draw mine blast as big expanding ring
    if(ex2.type==='mine'){
      const r2=maxR*ex2.life;
      ctx.save();ctx.translate(ex2.x,ex2.y);
      ctx.strokeStyle=`rgba(255,${Math.floor(180*(1-ex2.life))},0,${1-ex2.life})`;
      ctx.lineWidth=6*(1-ex2.life)+1;
      ctx.beginPath();ctx.arc(0,0,r2,0,Math.PI*2);ctx.stroke();
      const g2=ctx.createRadialGradient(0,0,0,0,0,r2*0.7);
      g2.addColorStop(0,`rgba(255,255,100,${0.5*(1-ex2.life)})`);
      g2.addColorStop(1,'rgba(255,80,0,0)');
      ctx.fillStyle=g2;ctx.beginPath();ctx.arc(0,0,r2*0.7,0,Math.PI*2);ctx.fill();
      // Shockwave ring
      ctx.strokeStyle=`rgba(255,200,50,${0.4*(1-ex2.life)})`;
      ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r2*1.15,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    } else {
      drawExplosion(ctx,ex2.x,ex2.y,ex2.life);
    }
    if(ex2.life>=1)explosions.splice(i,1);
  }

  // ── Mines ──
  for(let i=mines.length-1;i>=0;i--){
    const m=mines[i];
    if(m.blasting)continue;
    m.x+=m.vx;m.y+=m.vy;m.frame++;
    // Off screen — remove
    if(m.x<-MINE_R*3||m.x>W+MINE_R*3||m.y<-MINE_R*3||m.y>H+MINE_R*3){mines.splice(i,1);continue;}
    drawMine(ctx,m.x,m.y,MINE_R,m.frame);
    // Bullet hits mine → blast
    let hitByBullet=false;
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];
      const dx=b.x-m.x,dy=b.y-m.y;
      if(Math.sqrt(dx*dx+dy*dy)<MINE_R+6){
        bullets.splice(bi,1);
        mines.splice(i,1);
        triggerMineBlast(m.x,m.y);
        hitByBullet=true;
        break;
      }
    }
    if(hitByBullet)continue;
    // Player touches mine → lose life + blast
    if(!invincible){
      const dx=m.x-px,dy=m.y-py;
      if(Math.sqrt(dx*dx+dy*dy)<MINE_R+PR*0.8){
        mines.splice(i,1);
        triggerMineBlast(m.x,m.y);
        loseLife();
      }
    }
  }

  // ── Tick invincibility blink ──
  if(invincible){
    invincibleFrames--;
    if(invincibleFrames<=0){invincible=false;}
  }

  // ── Draw player (blink every 5 frames during invincibility) ──
  if(lives>0){
    if(!invincible || Math.floor(invincibleFrames/5)%2===0){
      ctx.save();
      if(invincible) ctx.globalAlpha=0.35; // transparent phase
      drawFish(ctx,px,py,PR);
      ctx.restore();
    }
  }

  animFr=requestAnimationFrame(loop);
}

// ── Virtual Joystick ──
const joyBase  = document.getElementById('joystickBase');
const joyThumb = document.getElementById('joystickThumb');
const joyZone  = document.getElementById('joystickZone');
const JOY_R    = 65;   // base radius (matches half of 130px CSS size)
const JOY_DEAD = 6;    // dead zone px
const JOY_SENS = 0.55; // sensitivity multiplier (1=full, lower=slower)
let joyActive=false, joyDx=0, joyDy=0;

let joyBaseX=0, joyBaseY=0; // anchor point set on touch start

// Pending visual state — applied once per rAF, never inside touch handler
let _joyPendingVisual=false, _joyThumbTX=0, _joyThumbTY=0;
let _joyBaseTX=0, _joyBaseTY=0, _joyBaseRepositioned=false;
// Cache gameArea rect — only read it on touch start (avoids forced layout on move)
let _gameRect={left:0,top:0};

function _applyJoyVisual(){
  _joyPendingVisual=false;
  if(_joyBaseRepositioned){
    // Use transform to move base — no layout reflow
    joyBase.style.transform=`translate(${_joyBaseTX}px,${_joyBaseTY}px)`;
    _joyBaseRepositioned=false;
  }
  // Thumb offset within the base — pure transform, GPU composited
  joyThumb.style.transform=`translate(calc(-50% + ${_joyThumbTX}px), calc(-50% + ${_joyThumbTY}px))`;
}

function joyStart(cx,cy){
  joyActive=true;
  joyThumb.classList.add('active');
  // Read layout ONCE here, not on every move
  _gameRect=gameAreaEl.getBoundingClientRect();
  joyBaseX=cx;
  joyBaseY=cy;
  // Reposition base via transform relative to its default bottom-left position
  _joyBaseTX=(cx-_gameRect.left-JOY_R)-18;
  _joyBaseTY=(cy-_gameRect.top -JOY_R)-((_gameRect.height||580)-JOY_R*2-18);
  _joyBaseRepositioned=true;
  _joyThumbTX=0;_joyThumbTY=0;
  if(!_joyPendingVisual){_joyPendingVisual=true;requestAnimationFrame(_applyJoyVisual);}
  joyMove(cx,cy);
}
function joyMove(cx,cy){
  if(!joyActive)return;
  let dx=cx-joyBaseX, dy=cy-joyBaseY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const clamped=Math.min(dist,JOY_R-4);
  const nx=dist>0?dx/dist:0, ny=dist>0?dy/dist:0;
  // Store thumb offset — no DOM write here
  _joyThumbTX=nx*clamped;
  _joyThumbTY=ny*clamped;
  if(!_joyPendingVisual){_joyPendingVisual=true;requestAnimationFrame(_applyJoyVisual);}
  joyDx = dist>JOY_DEAD ? nx*JOY_SENS : 0;
  joyDy = dist>JOY_DEAD ? ny*JOY_SENS : 0;
}
function joyEnd(){
  joyActive=false;
  joyDx=0;joyDy=0;
  joyThumb.classList.remove('active');
  _joyThumbTX=0;_joyThumbTY=0;
  _joyBaseTX=0;_joyBaseTY=0;_joyBaseRepositioned=true;
  if(!_joyPendingVisual){_joyPendingVisual=true;requestAnimationFrame(_applyJoyVisual);}
}

let audioCtx=null, musicNodes=[], musicRunning=false;

function getAudioCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

// iOS / mobile unlock — warm up audio context on very first user touch
function unlockAudio(){
  const ctx=getAudioCtx();
  // Play a silent buffer to fully unlock the context
  const buf=ctx.createBuffer(1,1,ctx.sampleRate);
  const src=ctx.createBufferSource();src.buffer=buf;
  src.connect(ctx.destination);src.start(0);
  document.removeEventListener('touchstart',unlockAudio);
  document.removeEventListener('mousedown',unlockAudio);
}
document.addEventListener('touchstart',unlockAudio,{once:true,passive:true});
document.addEventListener('mousedown',unlockAudio,{once:true,passive:true});

// Master gain
let masterGain=null;

// ── helpers ──
function makeGain(val,ctx){const g=ctx.createGain();g.gain.value=val;return g;}
function connect(...nodes){for(let i=0;i<nodes.length-1;i++)nodes[i].connect(nodes[i+1]);}

// ── Reverb (convolver with impulse) ──
function makeReverb(ctx,seconds=2.5,decay=2){
  const len=ctx.sampleRate*seconds;
  const buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
  const conv=ctx.createConvolver();conv.buffer=buf;return conv;
}

// ── Low-pass filter ──
function makeLPF(ctx,freq=800){
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;f.Q.value=0.8;return f;
}

// Notes — pentatonic in A minor (oceanic feel)
const SCALE=[220,246.94,261.63,293.66,329.63,392,440,493.88,523.25,587.33,659.25,783.99];
const BASS=[55,65.41,73.42,82.41,87.31,98,110];

function playNote(ctx,dest,freq,startT,dur,vol=0.12,type='sine',detune=0){
  const osc=ctx.createOscillator();
  const env=ctx.createGain();
  osc.type=type;osc.frequency.value=freq;osc.detune.value=detune;
  env.gain.setValueAtTime(0,startT);
  env.gain.linearRampToValueAtTime(vol,startT+0.04);
  env.gain.exponentialRampToValueAtTime(vol*0.6,startT+dur*0.5);
  env.gain.exponentialRampToValueAtTime(0.0001,startT+dur);
  osc.connect(env);env.connect(dest);
  osc.start(startT);osc.stop(startT+dur+0.05);
  return osc;
}

function startMusic(){
  if(musicRunning)return;
  musicRunning=true;
  const ctx=getAudioCtx();
  masterGain=makeGain(0.55,ctx);
  masterGain.connect(ctx.destination);
  const reverb=makeReverb(ctx,3,2.2);
  const lpf=makeLPF(ctx,1200);
  const reverbGain=makeGain(0.38,ctx);
  reverb.connect(reverbGain);reverbGain.connect(masterGain);
  lpf.connect(masterGain);

  // ── 1. Deep pulsing bass drone ──
  (function bassDrone(){
    if(!musicRunning)return;
    const t=ctx.currentTime;
    const bassNotes=[55,55,65.41,55];
    bassNotes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const env=ctx.createGain();
      osc.type='sine';osc.frequency.value=freq;
      env.gain.setValueAtTime(0,t+i*0.5);
      env.gain.linearRampToValueAtTime(0.18,t+i*0.5+0.1);
      env.gain.exponentialRampToValueAtTime(0.0001,t+i*0.5+0.48);
      osc.connect(env);env.connect(lpf);
      osc.start(t+i*0.5);osc.stop(t+i*0.5+0.5);
    });
    musicNodes._bassT=setTimeout(bassDrone, 2000);
  })();

  // ── 2. Ambient melody — slow pentatonic arpeggios ──
  (function melody(){
    if(!musicRunning)return;
    const t=ctx.currentTime;
    // pick 4-6 random notes from scale, spread over 3 seconds
    const n=4+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const freq=SCALE[Math.floor(Math.random()*SCALE.length)];
      const offset=i*(3/n)+Math.random()*0.3;
      playNote(ctx,reverb,freq,t+offset,1.2+Math.random()*0.8,0.09,'sine',Math.random()*4-2);
    }
    musicNodes._melT=setTimeout(melody,3200+Math.random()*800);
  })();

  // ── 3. Shimmery high pads ──
  (function pads(){
    if(!musicRunning)return;
    const t=ctx.currentTime;
    const padNotes=[523.25,587.33,659.25,783.99];
    padNotes.slice(0,2+Math.floor(Math.random()*2)).forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const env=ctx.createGain();
      osc.type='triangle';osc.frequency.value=freq;osc.detune.value=Math.random()*6-3;
      env.gain.setValueAtTime(0,t);
      env.gain.linearRampToValueAtTime(0.04,t+0.8);
      env.gain.linearRampToValueAtTime(0.04,t+3.5);
      env.gain.linearRampToValueAtTime(0,t+5);
      osc.connect(env);env.connect(reverb);
      osc.start(t);osc.stop(t+5.2);
    });
    musicNodes._padT=setTimeout(pads,5000+Math.random()*2000);
  })();

  // ── 4. Bubbling water texture ──
  (function bubbles(){
    if(!musicRunning)return;
    const t=ctx.currentTime;
    for(let i=0;i<3+Math.floor(Math.random()*3);i++){
      const freq=800+Math.random()*1200;
      const osc=ctx.createOscillator();
      const env=ctx.createGain();
      osc.type='sine';osc.frequency.value=freq;
      osc.frequency.linearRampToValueAtTime(freq*1.5,t+i*0.18+0.12);
      env.gain.setValueAtTime(0,t+i*0.18);
      env.gain.linearRampToValueAtTime(0.025,t+i*0.18+0.02);
      env.gain.exponentialRampToValueAtTime(0.0001,t+i*0.18+0.14);
      osc.connect(env);env.connect(reverb);
      osc.start(t+i*0.18);osc.stop(t+i*0.18+0.16);
    }
    musicNodes._bubT=setTimeout(bubbles,400+Math.random()*600);
  })();

  // ── 5. Subtle rhythm pulse ──
  (function rhythm(){
    if(!musicRunning)return;
    const t=ctx.currentTime;
    // soft thud
    const buf=ctx.createBuffer(1,ctx.sampleRate*0.15,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.04));
    const src=ctx.createBufferSource();src.buffer=buf;
    const env=ctx.createGain();env.gain.value=0.08;
    const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=180;
    src.connect(filter);filter.connect(env);env.connect(masterGain);
    src.start(t);
    musicNodes._rytT=setTimeout(rhythm,750+Math.random()*250);
  })();
}

function stopMusic(){
  musicRunning=false;
  clearTimeout(musicNodes._bassT);
  clearTimeout(musicNodes._melT);
  clearTimeout(musicNodes._padT);
  clearTimeout(musicNodes._bubT);
  clearTimeout(musicNodes._rytT);
  if(masterGain){
    try{masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);}catch(e){}
    setTimeout(()=>{try{masterGain.disconnect();}catch(e){}},600);
    masterGain=null;
  }
}

function pauseMusic(){
  if(audioCtx&&audioCtx.state==='running') audioCtx.suspend();
}
function resumeMusic(){
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
}

// Speed up music feel at higher stages by adjusting master gain slightly
function updateMusicIntensity(stageIdx){
  if(!masterGain)return;
  const vol=0.55+stageIdx*0.06;
  masterGain.gain.linearRampToValueAtTime(Math.min(vol,0.9),audioCtx.currentTime+1);
}

// ── Hook music into game events ──
// Start on first interaction (browser autoplay policy)
const _origStart=startGame;
window.startGame=function(){
  _origStart();
  startMusic();
};
document.getElementById('startBtn').removeEventListener('click',_origStart);
document.getElementById('restartBtn').removeEventListener('click',_origStart);
document.getElementById('startBtn').addEventListener('click',window.startGame);
document.getElementById('restartBtn').addEventListener('click',window.startGame);

// Pause / resume music with game pause
const _origPbtn=document.getElementById('pauseBtn').onclick;
document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!gameRunning)return;
  if(paused) resumeMusic(); else pauseMusic();
});
document.getElementById('resumeBtn').addEventListener('click',resumeMusic);

// Stop on game over
const _origEnd=endGame;
window.endGame=function(){
  _origEnd();
  stopMusic();
  // Play a little "game over" descending motif
  try{
    const ctx=getAudioCtx();
    [440,349.23,293.66,220].forEach((f,i)=>{
      playNote(ctx,ctx.destination,f,ctx.currentTime+i*0.22,0.3,0.12,'triangle');
    });
  }catch(e){}
};

// ── Pause audio when page is hidden (minimized / tab switch) ──
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    pauseMusic();
  } else {
    // Only resume if the game is actually running and not paused by the player
    if(gameRunning && !paused) resumeMusic();
  }
});

// Stage intensity updates — patch into stage check
const _origLoop=loop;
// We patch the stage check inline by watching stageEl changes via a small observer
const stageObs=new MutationObserver(()=>{
  const s=parseInt(document.getElementById('stageEl').textContent||'1')-1;
  updateMusicIntensity(s);
});
stageObs.observe(document.getElementById('stageEl'),{childList:true,characterData:true,subtree:true});

// ── Mute toggle button ──
const muteBtn=document.createElement('button');
muteBtn.id='muteBtn';
muteBtn.textContent='🔊';
muteBtn.title='Toggle music';
muteBtn.style.cssText='position:absolute;top:10px;right:10px;z-index:25;background:rgba(10,40,80,0.6);border:1px solid rgba(100,180,255,0.3);border-radius:8px;color:#7ecfff;font-size:14px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;';
let muted=false;
muteBtn.addEventListener('click',()=>{
  muted=!muted;
  if(masterGain) masterGain.gain.value=muted?0:0.55;
  muteBtn.textContent=muted?'🔇':'🔊';
});
document.getElementById('gameArea').appendChild(muteBtn);
</script>
