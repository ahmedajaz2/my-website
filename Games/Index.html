<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orb Rush</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
    }#gameArea {
  position: relative;
  width: 360px;
  height: 640px;
  background: linear-gradient(to bottom, #111827, #1f2937);
  overflow: hidden;
  border-radius: 24px;
  border: 2px solid #374151;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.player {
  position: absolute;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: cyan;
  bottom: 60px;
  box-shadow: 0 0 20px cyan;
}

.obstacle {
  position: absolute;
  border-radius: 50%;
  background: red;
  box-shadow: 0 0 20px red;
}

  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white">  <h1 class="text-5xl font-black mb-2">ORB RUSH</h1>
  <p class="text-gray-400 mb-4">Dodge the falling orbs and survive.</p>  <div class="flex gap-4 mb-4 text-sm">
    <div class="bg-gray-900 px-4 py-2 rounded-xl">Score: <span id="score">0</span></div>
    <div class="bg-gray-900 px-4 py-2 rounded-xl">High: <span id="highScore">0</span></div>
  </div>  <div id="gameArea">
    <div id="player" class="player"></div><div id="startScreen" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center z-10">
  <button id="startBtn" class="bg-cyan-400 text-black font-bold px-6 py-3 rounded-2xl text-xl hover:scale-105 transition">
    Start Game
  </button>
</div>

<div id="gameOverScreen" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-10">
  <h2 class="text-4xl font-bold mb-4">Game Over</h2>
  <p class="mb-4">Final Score: <span id="finalScore"></span></p>
  <button id="restartBtn" class="bg-pink-500 px-6 py-3 rounded-2xl font-bold text-xl">
    Play Again
  </button>
</div>

  </div>  <script>
    const gameArea = document.getElementById('gameArea');
    const player = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');

    const GAME_WIDTH = 360;
    const GAME_HEIGHT = 640;
    const PLAYER_SIZE = 28;

    let playerX = GAME_WIDTH / 2 - PLAYER_SIZE / 2;
    let obstacles = [];
    let score = 0;
    let speed = 4;
    let gameRunning = false;
    let spawnInterval;
    let animationFrame;

    let highScore = localStorage.getItem('orbRushHighScore') || 0;
    highScoreEl.textContent = highScore;

    player.style.left = playerX + 'px';

    function startGame() {
      score = 0;
      speed = 4;
      obstacles.forEach(o => o.el.remove());
      obstacles = [];
      gameRunning = true;

      scoreEl.textContent = score;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      spawnInterval = setInterval(spawnObstacle, 650);
      gameLoop();
    }

    function endGame() {
      gameRunning = false;
      clearInterval(spawnInterval);
      cancelAnimationFrame(animationFrame);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('orbRushHighScore', highScore);
        highScoreEl.textContent = highScore;
      }

      finalScoreEl.textContent = score;
      gameOverScreen.classList.remove('hidden');
    }

    function spawnObstacle() {
      const size = 20 + Math.random() * 30;
      const obstacle = document.createElement('div');

      obstacle.classList.add('obstacle');
      obstacle.style.width = size + 'px';
      obstacle.style.height = size + 'px';

      const x = Math.random() * (GAME_WIDTH - size);

      obstacle.style.left = x + 'px';
      obstacle.style.top = '-40px';

      gameArea.appendChild(obstacle);

      obstacles.push({
        el: obstacle,
        x,
        y: -40,
        size,
      });
    }

    function gameLoop() {
      if (!gameRunning) return;

      score++;
      scoreEl.textContent = score;

      if (score % 100 === 0) {
        speed += 0.4;
      }

      obstacles.forEach((o, index) => {
        o.y += speed;
        o.el.style.top = o.y + 'px';

        const collision =
          o.x < playerX + PLAYER_SIZE &&
          o.x + o.size > playerX &&
          o.y < GAME_HEIGHT - 60 + PLAYER_SIZE &&
          o.y + o.size > GAME_HEIGHT - 60;

        if (collision) {
          endGame();
        }

        if (o.y > GAME_HEIGHT + 50) {
          o.el.remove();
          obstacles.splice(index, 1);
        }
      });

      animationFrame = requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      if (!gameRunning) return;

      if (e.key === 'ArrowLeft') {
        playerX = Math.max(0, playerX - 30);
      }

      if (e.key === 'ArrowRight') {
        playerX = Math.min(GAME_WIDTH - PLAYER_SIZE, playerX + 30);
      }

      player.style.left = playerX + 'px';
    });

    gameArea.addEventListener('touchmove', (e) => {
      if (!gameRunning) return;

      const rect = gameArea.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;

      playerX = Math.max(0, Math.min(GAME_WIDTH - PLAYER_SIZE, touchX - PLAYER_SIZE / 2));
      player.style.left = playerX + 'px';
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  </script></body>
</html>
